[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpubma"
version = "0.3.0rc1"
description = "Budgeted high-evidence model discovery, with separate exhaustive BMA reference tools"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Favio Leiva"}]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "torch>=2.2"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
plots = ["matplotlib>=3.7", "pyarrow>=14"]
notebooks = ["matplotlib>=3.7", "pyarrow>=14", "jupyter>=1", "nbclient>=0.10"]
dev = ["pytest>=8", "build>=1", "nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "Pillow>=10"]

[project.scripts]
gpubma = "gpubma.cli:main"
gpubma-bfg = "gpubma.bfg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpubma.benchmarks" = ["canonical_p30_reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
